syntax = "proto3";
package api.v1alpha1;

// Request for a certificate to be issued
message IssueCertRequest {
    // Example: foo.bar.com
    string dns_name = 1;
}

// A successful response containing a issued certificate
message IssueCertResponse {
    // A blob containing the cert
    string certificate = 1;
    // A blob containing the private key
    string private_key = 2;
    // The DNS names this certificate is valid for
    repeated string names = 3;
}

// A request for ping
message PingRequest {
    string msg = 1;
}

// A response for ping
message PingResponse {
    string msg = 2;
}

message OnCertificateRenewalRequest {
    // A list of DNS names to monitor for renewals
    repeated string dns_names = 1;
}

// Response for a certificate that has been renewed on the server
message OnCertificateRenewalResponse {
    // Example: foo.bar.com
    string dns_name = 1;
}

service CertificateIssuerService {
    rpc IssueCert (IssueCertRequest) returns (IssueCertResponse) {
    }
    rpc Ping (PingRequest) returns (PingResponse) {
    }
    rpc OnCertificateRenewal (OnCertificateRenewalRequest) returns (stream OnCertificateRenewalResponse) {}
}
